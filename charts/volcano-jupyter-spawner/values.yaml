#      path: "/export/users/namdp"
#      mountPath: "/home/jovyan/work"
#      readOnly: false
#    - server: "10.0.0.6"
#      path: "/export/datasets/imagenet"
#      mountPath: "/data/imagenet"
#      readOnly: true

# -- Networking
ingress:
  host: "jupyter.example.com"
  className: "nginx"

# -- Container Image
image:
  repository: "jupyter/base-notebook"
  tag: "latest"
