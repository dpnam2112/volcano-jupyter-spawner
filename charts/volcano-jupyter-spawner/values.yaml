# -- Job Configuration
username: "johndoe"
jobName: "jupyter-123"
queue: "default"
# wallTimeSeconds: 14400  # Optional: e.g., 4 hours = 14400 seconds. Leave empty to disable.
orgPrefix: org.example.com

# -- Compute Requirements
resources:
  cpu: "2"
  memory: "2Gi"
  volcano.sh/vgpu-number: "1"

# -- Storage Configuration (NFS)
nfs:
  mounts: []
